# Déploiement production SendProColis — domaine unique, HTTPS automatique via Caddy.
#
# Topologie :
#   Internet ──443/80──▶ caddy ──┬── / (SPA React, fichiers statiques)
#                                 ├── /api/*     ─▶ api:8080
#                                 └── /uploads/* ─▶ api:8080
#   api ─▶ postgres (réseau interne uniquement, aucun port exposé)
#
# Prérequis sur le VPS : les deux repos clonés côte à côte
#   ./SendProColis-Web   (ce repo — lancer compose ici)
#   ./SendProColis-Api   (repo API, sibling)
#
# Copier .env.production.example vers .env et renseigner les valeurs avant `docker compose up`.

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${DOMAIN}/api/v1
        VITE_APP_RELEASE: ${APP_RELEASE:-dev}
        VITE_FARO_ENABLED: ${FARO_ENABLED:-true}
    image: sendprocolis-web:latest
    container_name: sendprocolis-caddy
    restart: unless-stopped
    # Le port 2019 (admin + /metrics) n'est volontairement PAS publié : il n'est
    # joignable que depuis le réseau Docker d'observabilité.
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    volumes:
      - caddy-data:/data      # certificats Let's Encrypt (à persister !)
      - caddy-config:/config
    networks:
      - default
      # Donne accès au receiver Faro (alloy:12347) et permet à Prometheus de
      # venir scraper Caddy. Réseau créé par la stack d'observabilité de l'API.
      - observability
    depends_on:
      - api

  api:
    build:
      context: ../SendProColis-Api
    image: sendprocolis-api:latest
    container_name: sendprocolis-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/sendprocolis?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      OTP_EXPIRES_MINUTES: 10
      UPLOAD_STORAGE: local
      UPLOAD_LOCAL_DIR: uploads
      # URL publique : sert à construire les liens des fichiers uploadés (/uploads/...).
      PUBLIC_BASE_URL: https://${DOMAIN}
      # Même origine que le web → CORS de fait inactif, mais on le verrouille quand même.
      CORS_ORIGIN: https://${DOMAIN}
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 300
      AUTH_RATE_LIMIT_MAX: 30
      # Brevo (SendinBlue) — notifications email & SMS
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
      BREVO_SMS_SENDER: ${BREVO_SMS_SENDER}
    volumes:
      - api-uploads:/app/uploads
    networks:
      - default
      # Prometheus scrape api:8080/internal/metrics depuis ce réseau ; la route
      # reste protégée par son propre bearer token et n'est pas exposée par Caddy.
      - observability
    # Aucun `ports:` → l'API n'est joignable que par Caddy sur le réseau interne.

  # postgres:  # Utilise la base locale (host.docker.internal) — décommenter pour utiliser un conteneur Docker
  #   image: postgres:16-alpine
  #   container_name: sendprocolis-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: sendprocolis
  #     POSTGRES_USER: sendprocolis
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - default
  #     - observability
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U sendprocolis -d sendprocolis"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  default:
  # Réseau partagé avec la stack d'observabilité
  # (ProColis-Api/deploy/observability/compose.yml, qui le déclare `external`).
  # C'est ce Compose-ci qui le crée : le démarrer en premier, la stack
  # d'observabilité ensuite.
  observability:
    name: ${PROCOLIS_DOCKER_NETWORK:-procolis-observability-shared}

volumes:
  caddy-data:
  caddy-config:
  api-uploads:
  postgres-data:
