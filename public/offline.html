<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#018982" />
    <title>Connexion indisponible — ProColis</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #f4f8f7; color: #153632; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      main { max-width: 420px; }
      img { border-radius: 22px; }
      h1 { font-size: 30px; line-height: 1.2; }
      p { color: #4f625f; }
      button { margin-top: 16px; padding: 14px 28px; border: 0; border-radius: 12px; background: #018982; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/apple-touch-icon.png" alt="ProColis" width="88" height="88" />
      <h1>Retrouvons la connexion.</h1>
      <p>ProColis a besoin d’Internet pour accéder à vos colis et messages. Vérifiez votre Wi-Fi ou vos données mobiles, puis réessayez.</p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
